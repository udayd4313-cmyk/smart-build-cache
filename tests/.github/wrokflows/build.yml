
name: Smart Build Cache Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: .build_cache
          key: smart-build-${{ runner.os }}-${{ hashFiles('app.py', 'requirements.txt') }}
          restore-keys: |
            smart-build-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smart Cache Manager
        run: python cache_manager.py

      - name: Run Automated Tests
        run: pytest -v
